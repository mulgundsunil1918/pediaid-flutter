<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages serves this for any path it has no file for. Two apps
      // live on this domain now and they need different handling:
      //
      //   /academics/*  — the Academics SPA. Its own index.html reads ?p= and
      //                   restores the path, so bounce there with the path
      //                   after /academics/ encoded.
      //   everything else — the PediAid app at the root.
      //
      // Without the first branch every Academics deep link would land on the
      // root app instead, which is the failure this file exists to prevent.
      var l = window.location;
      var origin = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      var path = l.pathname;

      if (path.indexOf('/academics/') === 0 || path === '/academics') {
        var rest = path.replace(/^\/academics\/?/, '');
        l.replace(
          origin + '/academics/?p=' + encodeURIComponent(rest + l.search) + (l.hash || '')
        );
      } else {
        l.replace(origin + '/?p=' + encodeURIComponent(path.slice(1) + l.search) + (l.hash || ''));
      }
    </script>
  </head>
  <body></body>
</html>
