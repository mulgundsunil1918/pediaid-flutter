<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PediAid — Paediatric & Neonatal Clinical Reference">

  <!-- Cache busting on deploy. The Flutter service worker still does the
       smart asset diff via a build hash, but browsers can hold onto the
       index.html itself for hours on GitHub Pages. Telling the browser
       "this HTML is never fresh" makes every reload re-fetch the
       bootstrap script, which then picks up the latest serviceWorkerVersion. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PediAid">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PediAid</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Flutter's engine (CanvasKit + the compiled Dart app) has to download,
    parse and boot before it paints its first frame — with nothing here,
    that's several seconds of a totally blank white page, which reads as
    "stuck" rather than "loading". This div paints instantly (pure CSS, no
    JS/Dart needed) and sits earlier in the DOM than Flutter's own
    <flutter-view>; once that view renders (full-viewport, opaque
    background), it naturally covers this without any script needed to
    remove it.
  -->
  <style>
    #pediaid-boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #pediaid-boot-loader .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #cbd5e1;
      border-top-color: #1565C0;
      border-radius: 50%;
      animation: pediaid-spin 0.8s linear infinite;
    }
    #pediaid-boot-loader .label {
      color: #1565C0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    @keyframes pediaid-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <div id="pediaid-boot-loader">
    <div class="spinner"></div>
    <div class="label">PediAid</div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
