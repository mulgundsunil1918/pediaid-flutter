<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PediAid — Paediatric & Neonatal Clinical Reference">

  <!-- Cache busting on deploy. The Flutter service worker still does the
       smart asset diff via a build hash, but browsers can hold onto the
       index.html itself for hours on GitHub Pages. Telling the browser
       "this HTML is never fresh" makes every reload re-fetch the
       bootstrap script, which then picks up the latest serviceWorkerVersion. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PediAid">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PediAid</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Flutter's engine (CanvasKit + the compiled Dart app) has to download,
    parse and boot before it paints its first frame — with nothing here,
    that's several seconds of a totally blank white page, which reads as
    "stuck" rather than "loading". This div paints instantly (pure CSS, no
    JS/Dart needed) and sits earlier in the DOM than Flutter's own
    <flutter-view>.

    The wordmark fill and percentage are a SIMULATED eased climb to ~92% —
    there's no reliable granular progress signal from the Flutter web
    loader to drive this honestly. Reaching 100% and the zoom-out
    transition, however, are gated on the real 'flutter-first-frame'
    event the engine dispatches once it has actually painted — so the
    loader never claims to be done before the app is. A timeout is a
    safety net only, in case that event is ever missed.
  -->
  <style>
    #pediaid-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(120vmax 90vmax at 30% 15%, #24487a 0%, #16304f 45%, #0c1e33 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 480ms cubic-bezier(.4,0,.2,1), transform 480ms cubic-bezier(.4,0,.2,1);
    }
    #pediaid-boot-loader.pediaid-boot-done {
      opacity: 0;
      transform: scale(1.4);
      pointer-events: none;
    }
    #pediaid-boot-loader .loader-card {
      position: relative;
      padding: 40px 56px;
      border-radius: 22px;
      background: rgba(8, 18, 32, 0.72);
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.55);
      text-align: center;
      min-width: 280px;
    }
    #pediaid-boot-loader .loader-text-wrap {
      position: relative;
      display: inline-block;
      font-size: clamp(34px, 8vw, 52px);
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1;
    }
    #pediaid-boot-loader .loader-text-base,
    #pediaid-boot-loader .loader-text-fill {
      display: block;
      white-space: nowrap;
    }
    #pediaid-boot-loader .loader-text-base {
      color: rgba(255,255,255,0.14);
    }
    #pediaid-boot-loader .loader-text-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, #ffffff 0%, #bfe0ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      clip-path: inset(100% 0 0 0);
    }
    #pediaid-boot-loader .loader-pct {
      margin-top: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }
    #pediaid-boot-loader .loader-pct .n {
      color: rgba(255,255,255,0.8);
    }
    @media (prefers-reduced-motion: reduce) {
      #pediaid-boot-loader,
      #pediaid-boot-loader.pediaid-boot-done {
        transition: opacity 200ms linear;
        transform: none !important;
      }
    }
  </style>
  <div id="pediaid-boot-loader">
    <div class="loader-card">
      <div class="loader-text-wrap">
        <span class="loader-text-base">PediAid</span>
        <span class="loader-text-fill" id="pediaid-boot-fill">PediAid</span>
      </div>
      <div class="loader-pct">Loading&nbsp; <span class="n" id="pediaid-boot-pct">0%</span></div>
    </div>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('pediaid-boot-loader');
      var fill = document.getElementById('pediaid-boot-fill');
      var pctEl = document.getElementById('pediaid-boot-pct');
      if (!loader || !fill || !pctEl) return;

      var done = false;
      var rafId = null;

      function setPct(p) {
        var clamped = Math.max(0, Math.min(100, p));
        fill.style.clipPath = 'inset(' + (100 - clamped) + '% 0 0 0)';
        pctEl.textContent = Math.round(clamped) + '%';
      }

      var start = null;
      function tick(ts) {
        if (start === null) start = ts;
        var t = Math.min(1, (ts - start) / 2200);
        var eased = 1 - Math.pow(1 - t, 3);
        if (done) return;
        setPct(eased * 92);
        if (t < 1) rafId = requestAnimationFrame(tick);
      }
      rafId = requestAnimationFrame(tick);

      function finish() {
        if (done) return;
        done = true;
        if (rafId) cancelAnimationFrame(rafId);
        setPct(100);
        setTimeout(function () {
          loader.classList.add('pediaid-boot-done');
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 550);
        }, 220);
      }

      window.addEventListener('flutter-first-frame', finish);
      // Safety net only — real completion is the event above.
      setTimeout(finish, 9000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- =====================================================================
       Notice a new deploy without waiting for a cache to expire.

       GitHub Pages serves this file with a fixed Cache-Control: max-age=600
       that we cannot change, so after a deploy a browser can keep running a
       ten-minute-old app. The deploy looks like it did nothing, and the only
       advice available is "wait, or hard-refresh" — not something to tell
       real users.

       The escape is a request the HTTP cache cannot answer: cache:'no-store'
       refuses to involve it at all (unlike no-cache, which still revalidates
       through it), and the timestamp defeats any CDN edge. __BUILD_ID__ is
       stamped into this file at deploy time, so comparing it to the deployed
       version.json says whether THIS html is stale — which sessionStorage
       alone could never tell us on a first load.

       Guarded so it can only ever reload once per build id, and every failure
       path is silent: this is an enhancement and must never stop the app
       booting.
       ================================================================== -->
  <script>
    (function () {
      var MINE = '__BUILD_ID__';
      if (MINE.indexOf('BUILD_ID') !== -1) return; // not stamped (local dev)
      var KEY = 'pediaid_app_reloaded_for';
      try {
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (v) {
            if (!v || !v.buildId || v.buildId === MINE) return;
            if (sessionStorage.getItem(KEY) === v.buildId) return;
            sessionStorage.setItem(KEY, v.buildId);
            // New URL each time, so the cached html cannot answer it.
            window.location.replace(
              window.location.pathname + '?v=' + encodeURIComponent(v.buildId)
            );
          })
          .catch(function () {});
      } catch (e) {}
    })();
  </script>


  <!-- ═══ Install prompt, mobile web only ══════════════════════════════════
       Someone on a phone browser is one tap from a far better experience, and
       most never find it: Chrome buries "Install app" in a menu and iOS
       Safari has no install API at all — only Share → Add to Home Screen,
       which nobody discovers unaided.

       So the prompt is explicit, and different per platform because the
       destination genuinely differs:
         Android  — the real app exists, so send them to Play.
         iPhone   — no App Store build yet, so walk them through Add to Home
                    Screen, which gives a full-screen icon off the same code.

       Never shown when already installed (standalone display mode), never on
       desktop, and dismissible — but the dismissal lasts a week rather than
       forever, since someone who says "not now" on a night shift may well
       want it next week. -->
  <style>
    #pa-install{position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;
      display:none;background:#fff;border-radius:16px;padding:14px 14px 12px;
      box-shadow:0 18px 50px -12px rgba(15,35,70,.45),0 4px 14px -6px rgba(15,35,70,.25);
      font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      border:1px solid rgba(15,35,70,.10);animation:pa-rise .32s ease both}
    @keyframes pa-rise{from{transform:translateY(120%);opacity:0}to{transform:none;opacity:1}}
    #pa-install .pa-row{display:flex;align-items:flex-start;gap:11px}
    #pa-install .pa-ico{width:40px;height:40px;border-radius:11px;flex:0 0 auto;
      background:#1e3a5f;color:#fff;display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:17px;letter-spacing:-.02em}
    #pa-install h4{margin:0 0 3px;font-size:14.5px;font-weight:800;color:#0f2540}
    #pa-install p{margin:0;font-size:12.5px;line-height:1.45;color:#475569}
    #pa-install .pa-x{margin-left:auto;background:none;border:0;font-size:20px;
      line-height:1;color:#94a3b8;cursor:pointer;padding:0 2px}
    #pa-install .pa-cta{display:block;width:100%;margin-top:11px;text-align:center;
      background:linear-gradient(135deg,#1e3a5f,#2c5282);color:#fff;text-decoration:none;
      font-size:14px;font-weight:800;padding:11px;border-radius:11px;border:0;cursor:pointer}
    #pa-install .pa-hint{margin-top:9px;font-size:12px;color:#334155;
      background:#f1f5f9;border-radius:10px;padding:9px 11px;line-height:1.5}
  </style>
  <div id="pa-install" role="dialog" aria-live="polite">
    <div class="pa-row">
      <span class="pa-ico">P</span>
      <div>
        <h4 id="pa-title">Install PediAid</h4>
        <p id="pa-text">Faster, works offline, and opens straight from your home screen.</p>
      </div>
      <button class="pa-x" id="pa-close" aria-label="Dismiss">&times;</button>
    </div>
    <div id="pa-action"></div>
  </div>
  <script>
    (function () {
      var KEY = 'pediaid_install_dismissed_at';
      var WEEK = 7 * 24 * 60 * 60 * 1000;
      var el = document.getElementById('pa-install');

      function installed() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
            || window.navigator.standalone === true;
      }
      function dismissedRecently() {
        try {
          var t = parseInt(localStorage.getItem(KEY) || '0', 10);
          return t && (Date.now() - t) < WEEK;
        } catch (e) { return false; }
      }

      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua)
               || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);
      if ((!isIOS && !isAndroid) || installed() || dismissedRecently()) return;

      document.getElementById('pa-close').addEventListener('click', function () {
        el.style.display = 'none';
        try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
      });

      var action = document.getElementById('pa-action');

      if (isAndroid) {
        document.getElementById('pa-title').textContent = 'Get the PediAid app';
        document.getElementById('pa-text').textContent =
          'The full app is on Google Play - faster, and works without a connection.';
        var a = document.createElement('a');
        a.className = 'pa-cta';
        a.href = 'https://play.google.com/store/apps/details?id=com.pediaid.pediaid';
        a.target = '_blank'; a.rel = 'noopener';
        a.textContent = 'Get it on Google Play';
        action.appendChild(a);

        // Chrome may still offer a real PWA install; prefer it when present,
        // since it is one tap rather than a store round trip.
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          var b = document.createElement('button');
          b.className = 'pa-cta';
          b.style.marginTop = '8px';
          b.style.background = '#0f766e';
          b.textContent = 'Or install this web app';
          b.addEventListener('click', function () {
            b.disabled = true;
            e.prompt();
          });
          action.appendChild(b);
        });
      } else {
        // iOS: no install API exists. Instructions are the only route.
        document.getElementById('pa-title').textContent = 'Add PediAid to your Home Screen';
        document.getElementById('pa-text').textContent =
          'Two taps, and it opens full screen like an app - no App Store needed.';
        var d = document.createElement('div');
        d.className = 'pa-hint';
        d.innerHTML = 'Tap <strong>Share</strong> at the bottom of Safari, then '
                    + '<strong>Add to Home Screen</strong>.';
        action.appendChild(d);
      }

      // After first paint, so it never competes with the app booting.
      setTimeout(function () { el.style.display = 'block'; }, 2500);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
